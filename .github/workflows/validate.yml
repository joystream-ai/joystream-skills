name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Official Agent Skills reference validator, pinned. Bump deliberately.
  SKILLS_REF: git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref

jobs:
  skills-ref:
    name: Agent Skills spec (skills-ref)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: skills-ref validate (new and conformed skills)
        run: |
          set -euo pipefail
          # Skills still listed in validate-baseline.json are known not to conform yet
          # (CONTRIBUTING.md § 9 "Known exceptions"); every other skill must pass.
          baselined=$(python3 -c 'import json;print(" ".join(json.load(open("validate-baseline.json"))))')
          status=0
          for dir in skills/*/ templates/*/; do
            name=$(basename "$dir")
            if [[ " $baselined " == *" $name "* ]]; then
              echo "skip (baselined): $name"
              continue
            fi
            uvx -q --from "$SKILLS_REF" skills-ref validate "$dir" || status=1
          done
          exit $status

  repo-rules:
    name: Authoring standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: validate.py
        run: uv run scripts/validate.py
      - name: validate.py (template)
        run: uv run scripts/validate.py --root . templates/skill-template
      - name: shared copies in sync
        run: uv run scripts/sync_shared.py --check
      - name: README skills table in sync
        run: uv run scripts/readme_table.py --check
      - name: tests
        run: uv run --with pytest --with pyyaml --with jsonschema pytest tests -q -rs
